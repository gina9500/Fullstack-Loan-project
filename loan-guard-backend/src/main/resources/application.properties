spring.application.name=loan-guard-backend

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/loan?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.loanguard.backend.model
mybatis.configuration.map-underscore-to-camel-case=true

# 服务器配置
server.port=8080

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT配置
jwt.secret=myVeryLongAndSecureSecretThatIsAtLeast32Bytes!!
jwt.expiration=30000